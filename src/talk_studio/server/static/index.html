<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>talk-studio review</title>
  <link rel="stylesheet" href="/static/review.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▶</span>
      <span>talk-studio</span>
      <span id="source" class="source"></span>
    </div>
    <span id="remaining" class="remaining"></span>
  </header>

  <nav id="decisions" class="queue" aria-label="Choices waiting for you"></nav>

  <main id="decision" class="card" hidden>
    <div class="card-head">
      <div>
        <p id="decision-kind" class="eyebrow"></p>
        <h1 id="decision-title"></h1>
        <p id="decision-status" class="subtle"></p>
      </div>
      <div id="excerpts" class="segmented"></div>
    </div>

    <section id="frame" class="stage" hidden>
      <img id="frame-base" alt="Reference frame">
      <img id="frame-over" alt="Selected version">
      <div id="frame-divider"><span></span></div>
    </section>

    <section id="videos" class="stage" hidden>
      <div id="video-grid"></div>
    </section>

    <section id="player" class="player">
      <button id="play" class="round" aria-label="Play">▶</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
      <span id="clock" class="clock">0:00</span>
      <button id="sample-here" class="ghost small" title="Add an excerpt around this moment and render every version on it">Sample here</button>
    </section>

    <div id="candidates" class="segmented big"></div>
    <p id="hint" class="hint"></p>
  </main>

  <section id="done" class="card empty" hidden>
    <div class="check">✓</div>
    <h1>All caught up</h1>
    <p class="subtle">Nothing is waiting for your eye or ear. New rounds appear here when they are ready.</p>
  </section>

  <footer id="verdict" class="actionbar" hidden>
    <input id="note" type="text" placeholder="Add a note (optional for a pick, useful for a reject)" autocomplete="off">
    <button type="button" id="reject" class="ghost">Reject round</button>
    <button type="button" id="pick" class="primary">Pick</button>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/review.js"></script>
</body>
</html>
